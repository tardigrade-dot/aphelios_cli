[workspace]
# 1. 包含哪些子项目
members = [
    "aphelios_tool",
    "aphelios_slint",
    "aphelios_ocr",
    "aphelios_core",
    "aphelios_search",
    "aphelios_tts",
    "aphelios_asr",
    "aphelios_voice",
    # "aphelios_web",
]
resolver = "2"
# 2. 解决依赖版本冲突：在父项目统一管理依赖版本
[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.17"

clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

rand = "0.10"
rand_distr = "0.6"
indicatif = "0.18"

ort = { version = "2.0.0-rc.12" }
ndarray = "0.17.2"
tokenizers = { version = "0.23", default-features = false, features = [
    "onig",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
imageproc = "0.27.0"
ab_glyph = "0.2"

toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-indicatif = "0.3.14"
tracing-chrome = "0.7.2"
tracing-test = "0.2.6"
tracing-tracy = "0.11.4"
tracing-appender = "0.2"
tracing-tree = "0.4.1"

candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }

regex = "1.13"
#mistralrs = {version = "0.7.1-alpha.1" }

reqwest = "0.13"   # 统一到 0.13
once_cell = "1.21"
epub = "2.1.5"

usearch = "2.26"

fastembed = { version = "5.17", features = ["qwen3"] }
rusqlite = { version = "0.40", features = ["bundled"] }
glob = "0.3"
hayro = "0.7"
async-stream = "0.3.6"
futures-util = "0.3"
futures = "0.3"

imara-diff = "0.2.0"
jieba-rs = "0.10"
hf-hub = { version = "1.0", features = ["blocking"] }
itertools = "0.15"
measureme = "12.0.3"
eyre = "0.6.12"
rayon = "1.12"
symphonia = { version = "0.6", features = ["aac",
    "alac",       # Apple Lossless，m4a 常用
    "mp3",
    "flac",
    "isomp4",
    "mkv",] }
byteorder = "1.5"
rubato = "4.0"
rustfft = "6.4.1"
num-complex = "0.4.6"

phf = { version = "0.14.0", features = ["macros"] }

log = "0.4"
num-traits = "0.2"
safetensors = "0.8"
web-time = "=1.1.0"
tempfile = "3.27"
strum_macros = "0.28.0"
# vibevoice = { version = "0.1.0" }
base64 = "0.22"
#whisper-rs = "0.15.1"
async-openai = { version = "0.41", features = ["chat-completion"] }
minijinja = "2.21"
# usls = { version = "0.2.0-alpha.4", features = ["default", "coreml"] }
chrono = "0.4"
utoipa = "5"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
dirs = "6.0.0"
rfd = "0.17.2"
rodio = "0.22"
hound = "3.5"
lazy_static = "1.5"
unicode-normalization = "0.1"

chromiumoxide = { version = "0.9.1" }
num_cpus = "1.17"
test-log = "0.2"
similar = "3.1"
knf-rs-sys = "0.3"
ureq = { version = "3.3" }
opusic-sys = { version = "0.7" }
chinese-number = "0.8"
tray-icon = "0.24"
pdfium-render = { version = "0.9", features = ["pdfium_latest", "image_latest", "console_log"] }
crossbeam-channel = "0.5"
md5 = "0.8"

# 3. 统一管理包信息（可选，Rust 1.64+ 支持）
[workspace.package]
version = "0.0.3"
edition = "2021"
authors = ["Your Name <email@example.com>"]
license = "MIT"

[patch.crates-io]
# 强制统一 tokenizers 版本
tokenizers = { git = "https://github.com/huggingface/tokenizers", tag = "v0.21.4" }
usls = { git = "https://github.com/jamjamjon/usls", version = "0.2.0-alpha.4", rev = "4a053b8" }
ort = { git = "https://github.com/pykeio/ort", version = "2.0.0-rc.12", rev = "c5c6c3b" }

# mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", rev = "f4aa309" }

# candle-core = { path = "../../github.com/candle/candle-core" }
# candle-nn = { path = "../../github.com/candle/candle-nn" }
# candle-transformers = { path = "../../github.com/candle/candle-transformers" }
# candle-metal-kernels = { path = "../../github.com/candle/candle-metal-kernels" }

candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "31f35b1" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "31f35b1" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "31f35b1" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "31f35b1" }

[profile.release]
opt-level = "z"   # 优化代码体积 (也可选 "s")
lto = false        # TODO 绕过muda构建出错
codegen-units = 1 # 减少编译单元，增加优化空间
panic = "abort"   # 发生 panic 时直接退出，减少 unwind 栈回溯代码体积
strip = true      # 自动移除符号信息 (symbols)
debug = false     # 移除调试信息

# [workspace.lints.clippy]
# # Enable pedantic lints for stricter code quality
# # Priority -1 so individual lint settings override
# pedantic = { level = "warn", priority = -1 }

# # Pedantic overrides - these are too noisy or don't fit this codebase
# missing_errors_doc = "allow"        # Requires extensive documentation work
# missing_panics_doc = "allow"        # Requires extensive documentation work
# must_use_candidate = "allow"        # Very noisy, too subjective
# doc_markdown = "allow"              # Backticks in docs - low value for effort
# similar_names = "allow"             # Often false positives
# too_many_lines = "allow"            # Subjective function length
# module_name_repetitions = "allow"   # FooModule::Foo patterns are common and fine
# struct_excessive_bools = "allow"    # Sometimes structs legitimately need multiple bools
# fn_params_excessive_bools = "allow" # Sometimes functions legitimately need multiple bools
# items_after_statements = "allow"    # Style preference, not harmful
# uninlined_format_args = "allow"     # format!("{}", x) vs format!("{x}") is minor
# return_self_not_must_use = "allow"  # Builder pattern returns
# # Cast lints - many false positives in contexts where values are known to be in range
# cast_possible_truncation = "allow"
# cast_sign_loss = "allow"
# cast_precision_loss = "allow"
# cast_possible_wrap = "allow"
# # Note: cast_lossless is NOT allowed - prefer From::from() for clarity
# # Default::default() vs TypeName::default() is a style preference
# default_trait_access = "allow"
# # Sometimes separate match arms are clearer even if bodies are identical
# match_same_arms = "allow"
# # Some async functions don't await but are async for API consistency or future use
# unused_async = "allow"
# # let...else is newer syntax, current style is fine
# manual_let_else = "allow"
# # Used underscore bindings are sometimes intentional for documentation
# used_underscore_binding = "allow"
# # &Option<T> vs Option<&T> - sometimes &Option is intentional
# ref_option_ref = "allow"
# ref_option = "allow"
# # Appending format! to String - push_str with format is equivalent
# format_push_string = "allow"
# # Case-sensitive extension comparison is often intentional
# case_sensitive_file_extension_comparisons = "allow"
# # Unnecessary wrapping in Result - sometimes for API consistency
# unnecessary_wraps = "allow"
# # Passing by value when not consumed - often cleaner API design
# needless_pass_by_value = "allow"
# # Small Copy types by reference - often for API consistency
# trivially_copy_pass_by_ref = "allow"
# # Underscore-prefixed bindings - used for documentation or future use
# no_effect_underscore_binding = "allow"
# # Closure vs method reference - closure syntax is clearer: .map(|s| s.to_string())
# redundant_closure_for_method_calls = "allow"

